loadmodule "extensions/multiline";

serverinfo {
	sid = "0AA";
	name = "me.test";
	description = "Test server";
	network_name = "Test network";
};

class "default" {
	ping_time = 1000 minutes;
	connectfreq = 1000 minutes;
	number_per_ident = 1000;
	number_per_ip = 1000;
	number_per_ip_global = 1000;
	cidr_ipv4_bitlen = 24;
	cidr_ipv6_bitlen = 64;
	number_per_cidr = 1000;
	max_number = 1000;
	sendq = 4 megabytes;
};

connect "remote.test" {
	host = "::1";
	fingerprint = "test";
	class = "default";
};

connect "remote2.test" {
	host = "::1";
	fingerprint = "test";
	class = "default";
};

connect "remote3.test" {
	host = "::1";
	fingerprint = "test";
	class = "default";
};

auth {
	user = "*@*";
	class = "default";
};

general {
	ping_cookie = no;
	multiline_max_lines = 5;
	multiline_max_bytes = 50;
};
